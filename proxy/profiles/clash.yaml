allow-lan: true
mode: rule
mixed-port: 7890
log-level: info
ipv6: true
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

tun:
  enable: true
  stack: system
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  route-exclude-address:
    - 224.0.0.0/3
    - 10.0.0.0/8
    - 127.0.0.0/8
    - 100.64.0.0/10
    - 172.16.0.0/12
    - 169.254.0.0/16
    - 192.168.0.0/16

dns:
  enable: true
  listen: :1053
  ipv6: true
  enhanced-mode: fake-ip
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 'https://1.1.1.1/dns-query'
    - 'https://8.8.8.8/dns-query'
  nameserver-policy:
    '+.google.com': '111.88.96.50'
    '*.google.com': '111.88.96.50'
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - stun.*.*.*
    - stun.*.*
    - '*.local'
    - '+.arpa'
    - '+.bxteam.org'
    - 'localhost.*'
    - 'time.*'
    - 'pool.ntp.org'
    - '*.msftncsi.com'
    - '*.msftconnecttest.com'

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 2025, 8443]
    QUIC:
      ports: [443, 2026, 8443]
  skip-domain:
    - '+.push.apple.com'
    - 'dns.google'

profile:
  store-selected: true
  store-fake-ip: true

rule-providers:
  private-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/private.mrs
